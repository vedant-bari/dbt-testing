version: 2

models:

  - name: stg_customers

    columns:

      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_orders

    columns:

      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: amount
        tests:
          - not_null

  - name: fact_orders

    columns:

      - name: customer_id

        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id